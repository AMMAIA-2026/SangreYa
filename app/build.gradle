import org.gradle.testing.jacoco.tasks.JacocoReport

plugins {
    id 'com.android.application'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.register('jacocoDebugReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData.setFrom(files("$buildDir/jacoco/testDebugUnitTest.exec"))
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(fileTree("$buildDir/intermediates/javac/debug/classes") {
        exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class', '**/Manifest*.class'
    })
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/coverage/debug')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/coverage/debug/coverage.xml')
        csv.required = false
    }
}

android {
    namespace 'com.ammaia_ispc.sangreyamobile'
    compileSdk 33

    defaultConfig {
        applicationId "com.ammaia_ispc.sangreyamobile"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}

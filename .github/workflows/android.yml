name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas Android
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.1'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar tests, lint y compilar APK de prueba
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: SangreYa-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar reportes de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SangreYa-checks-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
